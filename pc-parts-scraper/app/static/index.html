<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PartsPrice UK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236d5dfc'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3E%C2%A3%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">£</span>
      <span class="brand-name">PartsPrice<span class="brand-uk">UK</span></span>
    </a>
    <div class="topbar-right">
      <span id="rate-remaining" class="rate-pill" title="Searches remaining this minute"></span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </header>

  <main class="page">
    <section class="hero" id="hero">
      <h1>Find the cheapest PC parts in the UK</h1>
      <p class="sub">Live prices from <span id="retailer-count">11</span> UK retailers, side by side.</p>
      <form id="search-form" class="search" role="search" autocomplete="off">
        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" name="q" type="search" placeholder="Search for a CPU, GPU, SSD, RAM…" maxlength="80" aria-label="Search" spellcheck="false">
        <button id="clear-btn" class="clear" type="button" aria-label="Clear" hidden>×</button>
        <button class="go" type="submit">Search</button>
      </form>
      <div id="categories" class="chips" aria-label="Popular searches"></div>
    </section>

    <section id="results" class="results" hidden>
      <div class="toolbar">
        <div class="summary">
          <strong id="summary-count"></strong>
          <span id="summary-meta" class="muted"></span>
          <button id="refresh-btn" class="link-btn" type="button" title="Fetch fresh prices now">Refresh</button>
        </div>
        <div class="controls">
          <label class="control"><span>Sort</span>
            <select id="sort">
              <option value="price">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="relevance">Best match</option>
              <option value="retailer">Retailer</option>
            </select>
          </label>
          <label class="control"><span>Min £</span><input id="min-price" type="number" min="0" step="1" inputmode="decimal" placeholder="0"></label>
          <label class="control"><span>Max £</span><input id="max-price" type="number" min="0" step="1" inputmode="decimal" placeholder="any"></label>
          <label class="control check"><input id="in-stock" type="checkbox"><span>In stock only</span></label>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar" aria-label="Retailers">
          <h2>Retailers</h2>
          <ul id="retailer-list" class="retailer-list"></ul>
          <p class="legend muted">
            <i><span class="dot ok"></span>live</i><i><span class="dot cached"></span>cached</i><i><span class="dot warn"></span>stale/empty</i><i><span class="dot bad"></span>blocked/error</i>
          </p>
        </aside>

        <div class="list-wrap">
          <div id="skeleton" class="skeleton" hidden></div>
          <p id="empty" class="empty" hidden></p>
          <ol id="list" class="list"></ol>
          <button id="more-btn" class="more" type="button" hidden>Show more</button>
        </div>
      </div>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <footer class="foot muted">
    Prices include VAT and are fetched directly from each retailer. Always confirm on the retailer's site before buying.
  </footer>

  <template id="row-tpl">
    <li class="row">
      <a class="thumb" target="_blank" rel="noopener noreferrer nofollow"><img alt="" loading="lazy" decoding="async"></a>
      <div class="body">
        <a class="title" target="_blank" rel="noopener noreferrer nofollow"></a>
        <div class="meta">
          <span class="retailer"></span>
          <span class="stock"></span>
          <span class="match muted"></span>
        </div>
      </div>
      <div class="pricing">
        <div class="price"></div>
        <div class="was muted"></div>
        <a class="view" target="_blank" rel="noopener noreferrer nofollow">View deal</a>
      </div>
    </li>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
